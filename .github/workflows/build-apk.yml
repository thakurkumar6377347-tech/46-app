name: Build 46 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract 46 project
        run: |
          mkdir project
          unzip -o 46_GitHub_Ready_Project.zip -d project

      - name: Build 46 APK
        run: gradle -p project assembleDebug

      - name: Upload 46 APK
        uses: actions/upload-artifact@v4
        with:
          name: 46-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
